  <script>
    document.fonts.load('72px Schoolbell').then((faces) => {
      if (!faces.length) throw new Error('Schoolbell did not load');
      const pathLength = document.querySelector('#credit-thread').getTotalLength();
      let trainLength = 0;
      // Facts follow the requested temporal order. Each phrase is drawn on
      // the same path, with native SVG per-letter bending and normal spelling.
      const phrases = [...document.querySelectorAll('textPath')].map((textPath) => {
        let width = 0;
        const words = [...textPath.querySelectorAll('tspan')].map((span, index) => {
          if (index) width += 32;
          const wordWidth = span.getComputedTextLength();
          const item = { span, width: wordWidth, offset: width };
          width += wordWidth;
          return item;
        });
        const phrase = { textPath, words, width, offset: trainLength };
        trainLength += width + 96;
        return phrase;
      });
      trainLength -= 96;
      const tl = gsap.timeline({ paused: true });
      // Shared travel in stop-motion poses; first fact:231frames.
      const flowFrames = 407;
      for (let step = 0; step <= Math.ceil(flowFrames / 3); step++) {
        const localFrame = Math.min(step * 3, flowFrames);
        const time = localFrame / 24;
        const head = (pathLength + trainLength + 80) * localFrame / flowFrames;
        phrases.forEach(({ textPath, words, width, offset }) => {
          const start = head - offset - width;
          tl.set(textPath, { attr: { startOffset: start } }, time);
          words.forEach((word) => {
            // Off-path glyphs are hidden beyond the offscreen endpoints.
            const visible = start + word.offset >= 0 && start + word.offset + word.width <= pathLength;
            tl.set(word.span, { opacity: visible ? 1 : 0 }, time);
          });
        });
      }
      window.__timelines = window.__timelines || {};
      window.__timelines['closing-notes'] = tl;
    });
  </script>
